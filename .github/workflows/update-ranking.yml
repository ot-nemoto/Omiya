name: Update framework ranking gists

on:
  schedule:
    # cron は UTC。JST 7:17 に実行（混雑する毎時 0 分を避けている）
    - cron: "17 22 * * *"
  workflow_dispatch:

concurrency:
  group: update-ranking
  cancel-in-progress: false

permissions:
  contents: write # keepalive の記録ファイルをコミットするために必要

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test
        id: test
        run: python -m unittest discover -s tests

      # Repository variable GIST_ID_FRONTEND / GIST_ID_BACKEND が未設定のカテゴリはスキップされる。
      # ★数の取得に失敗したカテゴリも更新をスキップし（前回の内容が残る）、ジョブは成功扱いにする。
      - name: Update ranking gists
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GIST_ID_FRONTEND: ${{ vars.GIST_ID_FRONTEND }}
          GIST_ID_BACKEND: ${{ vars.GIST_ID_BACKEND }}
          STALE_DAYS: ${{ vars.STALE_DAYS || '365' }}
        run: python scripts/ranking.py

      # 直近 GROWTH_DAYS 日（既定 7）の★の伸び幅ランキング。
      # Repository variable GIST_ID_FRONTEND_GROWTH / GIST_ID_BACKEND_GROWTH が未設定のカテゴリはスキップされる。
      # 総数ランキングが Gist エラーで失敗しても動かすが、テストが失敗したときは動かさない
      - name: Update growth gists
        if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        env:
          # stargazers の読み取りは GitHub App のトークン（github.token）では拒否されるため、
          # ユーザーのトークンである GIST_PAT（Classic PAT）を使う。公開情報の読み取りにスコープは不要
          GRAPHQL_TOKEN: ${{ secrets.GIST_PAT }}
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GIST_ID_FRONTEND_GROWTH: ${{ vars.GIST_ID_FRONTEND_GROWTH }}
          GIST_ID_BACKEND_GROWTH: ${{ vars.GIST_ID_BACKEND_GROWTH }}
          GROWTH_DAYS: ${{ vars.GROWTH_DAYS || '7' }}
          STALE_DAYS: ${{ vars.STALE_DAYS || '365' }}
        run: python scripts/growth.py

      # 60 日間アクティビティがないと scheduled workflow が停止するため、
      # 1 日 1 回だけ記録ファイルをコミットして「アクティビティ」を作る。
      - name: Keepalive commit
        if: ${{ !cancelled() }}
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%F)
          mkdir -p .state
          if [ "$(cat .state/last-run 2>/dev/null)" != "$TODAY" ]; then
            echo "$TODAY" > .state/last-run
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .state/last-run
            git commit -m "chore: keepalive $TODAY"
            git pull --rebase
            git push
          fi
