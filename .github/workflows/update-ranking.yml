name: Update framework ranking gists

on:
  schedule:
    # cron は UTC。JST 7:17 に実行（混雑する毎時 0 分を避けている）
    - cron: "17 22 * * *"
  workflow_dispatch:

concurrency:
  group: update-ranking
  cancel-in-progress: false

permissions:
  contents: write # ★数の記録（.state/*.json）と keepalive（.state/last-run）をコミットするために必要

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 起動時点の SHA ではなくブランチの先端を取る。実行が重なって待たされた場合も、
      # 先行の実行がコミットした .state/stars.json の上に記録を積めるようにする（rebase 時の衝突を防ぐ）
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test
        id: test
        run: python -m unittest discover -s tests

      # Repository variable GIST_ID_FRONTEND / GIST_ID_BACKEND が未設定のカテゴリはスキップされる。
      # ★数の取得に失敗したカテゴリも更新をスキップし（前回の内容が残る）、ジョブは成功扱いにする。
      - name: Update ranking gists
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GIST_ID_FRONTEND: ${{ vars.GIST_ID_FRONTEND }}
          GIST_ID_BACKEND: ${{ vars.GIST_ID_BACKEND }}
          STALE_DAYS: ${{ vars.STALE_DAYS || '365' }}
        run: python scripts/ranking.py

      # ranking.py が更新した★数の記録（.state/stars.json）を master にコミットする。
      # あわせて 60 日間アクティビティがないと scheduled workflow が停止するのを防ぐため、
      # .state/last-run も更新する（keepalive）。変更が無ければコミットしない。
      - name: Commit state (star history + keepalive)
        if: ${{ !cancelled() }}
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%F)
          mkdir -p .state
          echo "$TODAY" > .state/last-run
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .state/last-run
          if [ -f .state/stars.json ]; then git add .state/stars.json; fi
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            if git diff --cached --quiet -- .state/stars.json; then
              MSG="chore: keepalive $TODAY"
            else
              MSG="chore: update star history $TODAY"
            fi
            git commit -m "$MSG"
            git pull --rebase
            git push
          fi
